[project]
name = "kaeasy"
version = "0.6.0"
description = "Georgian writing skills plugin for Hermes agents"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Hermes tool handlers must never raise; they catch everything and return error JSON.
# N999 ignored because checkout directory on Windows may be capitalized ('Kaeasy').
ignore = ["BLE001", "N999"]
