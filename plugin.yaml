name: kaeasy
version: 0.6.0
description: "Kaeasy: Georgian (ka) writing skills for agents. Skills with references and examples, a zero-cost linter and fixer (ka_lint / ka_fix), TTS speech text (ka_speech) and a shared mistakes memory (ka_learn / ka_mistakes). No LLM calls, no API keys."
provides_tools:
  - ka_lint
  - ka_fix
  - ka_speech
  - ka_learn
  - ka_mistakes
provides_hooks:
  - pre_llm_call
requires_env: []
